server:
    addr: :8090
    read_timeout: 15s
    write_timeout: 1m0s
    trusted_proxies: []
admin:
    username: admin
    password: change-me-now
    session_ttl: 12h0m0s
database:
    dsn: data/request_logs.db
logs:
    request:
        retention_days: 7
        max_size_mb: 100
gateway:
    upstream_base_url: https://panel.example.com/index.php/api/cloud
    upstream_api_key: your-v1-api-key
    timeout: 30s
    cache_ttl: 30s
    max_body_bytes: 1048576
    require_api_key: false
    accepted_api_keys: []
    redact_fields:
        - apikey
        - api_key
        - signature
        - authorization
        - password
        - sys_pwd
        - panel_password
        - token
