root = "."
testdata_dir = "testdata"
tmp_dir = "tmp/air"

[build]
  args_bin = ["-config", "config.yaml"]
  bin = "./tmp/air/xiaoheiproxy.exe"
  cmd = "go build -o ./tmp/air/xiaoheiproxy.exe ./cmd/server"
  delay = 1000
  exclude_dir = [
    ".git",
    "automation_lightboat",
    "data",
    "tmp",
    "web/dist",
    "web/node_modules"
  ]
  exclude_file = []
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = [
    "cmd",
    "internal"
  ]
  include_ext = ["go", "yaml", "yml", "toml"]
  include_file = [
    "config.yaml",
    "config.example.yaml",
    "go.mod",
    "go.sum"
  ]
  kill_delay = "500ms"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = true

[misc]
  clean_on_exit = true

[proxy]
  app_port = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true

